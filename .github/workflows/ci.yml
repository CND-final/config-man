name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  # 1. Dedicated change detection job to save runner billing minutes
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - "backend/**"
              - ".github/workflows/ci.yml"
            frontend:
              - "frontend/**"
              - ".github/workflows/ci.yml"

  # 2. Go Backend Job (Only runs if backend changes)
  backend-ci:
    name: Backend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Prepare Environment & Integration Database
        run: |
          # 1. Create the .env file from your example template
          make env
          
          # 2. Inject the .env variables (DATABASE_URL, etc.) directly into the GitHub runner context
          cat .env >> $GITHUB_ENV
          
          # 3. Spin up PostgreSQL using your exact docker-compose.yml and wait for it to be ready
          make db-up

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run unit & integration tests
        # The Go tests will now automatically read the DATABASE_URL from $GITHUB_ENV
        run: go test -v -race ./... | tee test-output.txt

      - name: Publish Backend Test Summary
        if: always()
        run: |
          echo "### Backend Test Report" >> $GITHUB_STEP_SUMMARY
          
          if grep -q "FAIL" test-output.txt; then
            echo "❌ **Status:** Failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Status:** Passed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "#### Package Overview" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          grep -E "^(ok|FAIL)" test-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          if grep -q "--- FAIL:" test-output.txt; then
            echo "#### 🔍 Failed Tests" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
            grep "--- FAIL:" test-output.txt >> $GITHUB_STEP_SUMMARY || true
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build cmd targets
        run: go build -o /tmp/config-man ./cmd/...

  # 3. Vite Frontend Job (Only runs if frontend changes)
  frontend-ci:
    name: Frontend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "PKG_MANAGER=pnpm" >> "$GITHUB_ENV"
            echo "NODE_CACHE=pnpm" >> "$GITHUB_ENV"
            echo "NODE_CACHE_DEP=frontend/pnpm-lock.yaml" >> "$GITHUB_ENV"
          elif [ -f yarn.lock ]; then
            echo "PKG_MANAGER=yarn" >> "$GITHUB_ENV"
            echo "NODE_CACHE=yarn" >> "$GITHUB_ENV"
            echo "NODE_CACHE_DEP=frontend/yarn.lock" >> "$GITHUB_ENV"
          elif [ -f package-lock.json ]; then
            echo "PKG_MANAGER=npm" >> "$GITHUB_ENV"
            echo "NODE_CACHE=npm" >> "$GITHUB_ENV"
            echo "NODE_CACHE_DEP=frontend/package-lock.json" >> "$GITHUB_ENV"
            echo "NPM_INSTALL_CMD=ci" >> "$GITHUB_ENV"
          elif [ -f npm-shrinkwrap.json ]; then
            echo "PKG_MANAGER=npm" >> "$GITHUB_ENV"
            echo "NODE_CACHE=npm" >> "$GITHUB_ENV"
            echo "NODE_CACHE_DEP=frontend/npm-shrinkwrap.json" >> "$GITHUB_ENV"
            echo "NPM_INSTALL_CMD=ci" >> "$GITHUB_ENV"
          else
            echo "PKG_MANAGER=npm" >> "$GITHUB_ENV"
            echo "NODE_CACHE=npm" >> "$GITHUB_ENV"
            echo "NODE_CACHE_DEP=frontend/package-lock.json" >> "$GITHUB_ENV"
            echo "NPM_INSTALL_CMD=install" >> "$GITHUB_ENV"
          fi

      - name: Setup pnpm
        if: env.PKG_MANAGER == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ env.NODE_CACHE }}
          cache-dependency-path: ${{ env.NODE_CACHE_DEP }}

      - name: Enable Corepack (Yarn Berry/Pnpm fallback)
        if: env.PKG_MANAGER != 'npm'
        run: corepack enable

      - name: Install dependencies
        run: |
          case "$PKG_MANAGER" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm "$NPM_INSTALL_CMD" ;;
            *) echo "Unknown package manager: $PKG_MANAGER"; exit 1 ;;
          esac

      - name: Check formatting with Prettier
        # Removed continue-on-error so the pipeline correctly flags a failure
        run: npx --yes prettier --check . 2>&1 | tee prettier-output.txt

      - name: Publish Prettier Summary
        if: always()
        run: |
          echo "### Prettier Formatting Report" >> $GITHUB_STEP_SUMMARY
          
          if grep -q -E "\[warn\]|Error" prettier-output.txt; then
            echo "❌ **Status:** Failed" >> $GITHUB_STEP_SUMMARY
            echo "#### Unformatted Files" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
            # Extracts just the file names that triggered warnings, ignoring the extra instructional text
            grep "\[warn\]" prettier-output.txt | grep -v "Code style issues found" >> $GITHUB_STEP_SUMMARY || true
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Status:** Passed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run frontend tests
        # This ensures tests still run even if Prettier failed the job above
        if: success() || failure()
        env:
          FORCE_COLOR: 0
          NO_COLOR: true
        run: |
          case "$PKG_MANAGER" in
            pnpm) pnpm test --if-present 2>&1 | tee test-output.txt ;;
            yarn) yarn test --if-present 2>&1 | tee test-output.txt ;;
            npm) npm run test --if-present 2>&1 | tee test-output.txt ;;
            *) echo "Unknown package manager: $PKG_MANAGER"; exit 1 ;;
          esac

      - name: Publish Frontend Test Summary
        if: always()
        run: |
          echo "### Frontend Test Report" >> $GITHUB_STEP_SUMMARY
          
          if [ -s test-output.txt ]; then
            if grep -q -i "fail" test-output.txt; then
              echo "❌ **Status:** Failed" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ **Status:** Passed" >> $GITHUB_STEP_SUMMARY
            fi
            
            echo "#### Test Framework Output" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
            grep -E "Test Files|Tests|Duration|Snapshots|✓|$(printf '\u00d7')" test-output.txt >> $GITHUB_STEP_SUMMARY || true
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No tests were executed (test script not present in package.json or step was skipped)." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build production bundle
        # Ensures the build still runs to check for TS/bundling errors even if formatting/tests fail
        if: success() || failure()
        run: |
          case "$PKG_MANAGER" in
            pnpm) pnpm run build ;;
            yarn) yarn build ;;
            npm) npm run build ;;
            *) echo "Unknown package manager: $PKG_MANAGER"; exit 1 ;;
          esac